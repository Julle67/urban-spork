<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video Hub Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
    font-size: 14px;
}

.delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: red;
    border: none;
    color: white;
    padding: 4px 6px;
    border-radius: 6px;
}

.fav {
    position: absolute;
    top: 6px;
    left: 6px;
    background: gold;
    border: none;
    color: black;
    padding: 4px 6px;
    border-radius: 6px;
}

/* PLAYER */
.player {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: black;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

iframe {
    width: 90%;
    height: 70%;
    border: none;
}

.nav {
    margin-top: 10px;
    display: flex;
    gap: 10px;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="videoInput" placeholder="YouTube länk eller ID">
    <button onclick="addVideo()">Lägg till</button>

    <input id="search" placeholder="Sök i din lista">
    <button onclick="searchLocal()">Sök</button>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>

    <div class="nav">
        <button onclick="prev()">⬆</button>
        <button onclick="next()">⬇</button>
        <button onclick="closePlayer()">Stäng</button>
    </div>
</div>

<script>

/* ===== DATA ===== */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let currentIndex = 0;

/* ===== SAVE ===== */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* ===== VALIDATE YOUTUBE ===== */
function extractYouTubeID(input) {
    try {
        input = input.trim();
        const idRegex = /^[a-zA-Z0-9_-]{11}$/;

        if (idRegex.test(input)) return input;

        const url = new URL(input);

        if (url.hostname.includes("youtu.be")) {
            const id = url.pathname.slice(1);
            return idRegex.test(id) ? id : null;
        }

        if (url.hostname.includes("youtube.com")) {
            const id = url.searchParams.get("v");
            return idRegex.test(id) ? id : null;
        }

        return null;
    } catch {
        return null;
    }
}

/* ===== ADD VIDEO ===== */
function addVideo() {
    const input = document.getElementById("videoInput").value;
    const id = extractYouTubeID(input);

    if (!id) return alert("❌ Ogiltig video");

    if (videos.some(v => v.id === id)) return alert("Finns redan");

    videos.push({ id });
    save();
    load();

    document.getElementById("videoInput").value = "";
}

/* ===== FAVORITE ===== */
function toggleFav(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    load();
}

/* ===== LOAD ===== */
function load(list = videos) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${favorites.includes(v.id) ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div>${v.id}</div>
        `;

        card.onclick = () => open(i);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(i, 1);
            save();
            load();
        };

        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFav(v.id);
        };

        grid.appendChild(card);
    });
}

/* ===== SEARCH LOCAL ===== */
function searchLocal() {
    const q = document.getElementById("search").value.toLowerCase();

    const filtered = videos.filter(v => v.id.toLowerCase().includes(q));
    load(filtered);
}

/* ===== PLAYER ===== */
function open(i) {
    currentIndex = i;

    document.getElementById("player").style.display = "flex";
    document.getElementById("frame").src =
        `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

function closePlayer() {
    document.getElementById("player").style.display = "none";
    document.getElementById("frame").src = "";
}

function next() {
    if (currentIndex < videos.length - 1) open(currentIndex + 1);
}

function prev() {
    if (currentIndex > 0) open(currentIndex - 1);
}

/* INIT */
load();

</script>

</body>
</html>
