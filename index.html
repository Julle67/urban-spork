<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Very Cool Button</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 25px;
      background: linear-gradient(45deg, #4CAF50, #45a049);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }

    /* POPUP */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background: black;
      padding: 10px;
      border-radius: 15px;
    }

    iframe {
      width: 600px;
      height: 340px;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: red;
      color: white;
      cursor: pointer;
    }

    .fullscreen {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 5px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>

<button onclick="openModal()">Very Cool Button</button>

<div id="myModal" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">×</button>

    <iframe id="myVideo"
      src=""
      frameborder="0"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

    <button class="fullscreen" onclick="goFullscreen()">⛶</button>
  </div>
</div>

<script>
const videoID = "EeSlGlaK-Cg"; // <-- BYT TILL DIN YOUTUBE ID

function openModal() {
  const modal = document.getElementById("myModal");
  const iframe = document.getElementById("myVideo");

  iframe.src = `https://www.youtube.com/embed/${videoID}?autoplay=1`;
  modal.style.display = "flex";
}

function closeModal() {
  const modal = document.getElementById("myModal");
  const iframe = document.getElementById("myVideo");

  modal.style.display = "none";
  iframe.src = ""; // stoppar videon
}

function goFullscreen() {
  const iframe = document.getElementById("myVideo");

  if (iframe.requestFullscreen) {
    iframe.requestFullscreen();
  }
}
</script>

</body>
</html>
