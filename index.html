<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Pro Video App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

/* TOPBAR */
.topbar {
    padding: 12px;
    background: #111;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
    font-weight: bold;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* CARD */
.card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
    font-size: 14px;
}

/* buttons */
.delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: red;
    border: none;
    color: white;
    padding: 4px 6px;
    border-radius: 6px;
}

.fav {
    position: absolute;
    top: 6px;
    left: 6px;
    background: gold;
    border: none;
    color: black;
    padding: 4px 6px;
    border-radius: 6px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
    border: none;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <input id="search" placeholder="Sök video">
    <button onclick="searchVideos()">Sök</button>

    <input id="videoId" placeholder="YouTube ID">
    <button onclick="addVideo()">Lägg till</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- PLAYER -->
<div class="modal" id="modal">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>

/* ================= DATA ================= */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

/* ================= SAVE ================= */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* ================= ADD VIDEO ================= */
function addVideo() {
    const id = document.getElementById("videoId").value.trim();
    if (!id) return;

    videos.push({ id });
    save();
    loadVideos();
}

/* ================= FAVORITE ================= */
function toggleFav(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    loadVideos();
}

/* ================= SEARCH (REAL YOUTUBE OPEN) ================= */
function searchVideos() {
    const query = document.getElementById("search").value;
    if (!query) return;

    // RIKTIG sök på YouTube (inte fake)
    window.open(
        `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`,
        "_blank"
    );
}

/* ================= LOAD ================= */
function loadVideos() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach((v, index) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${favorites.includes(v.id) ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div>${v.id}</div>
        `;

        card.onclick = () => openVideo(v.id);

        // delete
        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(index, 1);
            save();
            loadVideos();
        };

        // favorite
        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFav(v.id);
        };

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* CLOSE */
document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

/* INIT */
loadVideos();

</script>

</body>
</html>
