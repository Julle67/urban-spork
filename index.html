<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Hub Pro</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #111;
    padding: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: white;
}

button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
}

#installBtn {
    display: none;
    background: #00c853;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.card img {
    width: 100%;
}

.player {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

iframe {
    width: 90%;
    height: 70%;
}
</style>
</head>

<body>

<div class="topbar">

    <input id="videoInput" placeholder="YouTube länk eller ID">
    <button onclick="addVideo()">Lägg till</button>

    <input id="search" placeholder="Sök">
    <button onclick="searchLocal()">Sök</button>

    <button onclick="showHelp()">Help</button>

    <button id="installBtn" onclick="installApp()">Installera app</button>

</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
    <iframe id="frame" allow="autoplay"></iframe>
    <button onclick="closePlayer()">Stäng</button>
</div>

<script>

/* =========================
   SERVICE WORKER FIX
========================= */

window.addEventListener("load", () => {
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(reg => {
                console.log("SW registered:", reg.scope);
            })
            .catch(err => console.error("SW error:", err));
    }
});

/* INSTALL LOGIC */
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    document.getElementById("installBtn").style.display = "inline-block";
});

function installApp() {
    if (!deferredPrompt) {
        alert("Install är inte tillgängligt just nu.");
        return;
    }

    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById("installBtn").style.display = "none";
    });
}

/* =========================
   DIN APP (oförändrad logik)
========================= */

let videos = JSON.parse(localStorage.getItem("videos")) || [];
let currentIndex = 0;

function addVideo() {
    const input = document.getElementById("videoInput").value;
    const id = input;
    videos.push({ id });
    localStorage.setItem("videos", JSON.stringify(videos));
    load();
}

function load() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
        `;

        card.onclick = () => open(i);

        grid.appendChild(card);
    });
}

function open(i) {
    currentIndex = i;
    document.getElementById("player").style.display = "flex";
    document.getElementById("frame").src =
        `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

function closePlayer() {
    document.getElementById("player").style.display = "none";
    document.getElementById("frame").src = "";
}

function searchLocal() {
    const q = document.getElementById("search").value.toLowerCase();
    load(videos.filter(v => v.id.toLowerCase().includes(q)));
}

function showHelp() {
    alert("Lägg in YouTube ID eller länk");
}

load();

</script>

</body>
</html>
