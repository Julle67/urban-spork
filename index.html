<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Hub Pro</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #0b0b0b 60%);
    color: #fff;
}

/* TOPBAR */
.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(15,15,15,0.9);
    backdrop-filter: blur(10px);
    padding: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

/* INPUTS */
input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: white;
    outline: none;
}

input:focus {
    border-color: red;
}

/* BUTTONS */
button {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #e50914;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* INSTALL BUTTON */
#installBtn {
    display: none;
    background: #00c853;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
    padding: 20px;
}

/* CARD */
.card {
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: fadeIn 0.3s ease;
}

.card:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    z-index: 2;
}

.card img {
    width: 100%;
    display: block;
}

/* DELETE */
.delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.6);
    border: none;
    padding: 5px 8px;
    border-radius: 6px;
}

/* PLAYER */
.player {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

iframe {
    width: 90%;
    height: 70%;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="topbar">

    <input id="videoInput" placeholder="YouTube länk eller ID">
    <button onclick="addVideo()">Lägg till</button>

    <input id="search" placeholder="Sök">
    <button onclick="searchLocal()">Sök</button>

    <button onclick="showHelp()">Help</button>

    <button id="installBtn" onclick="installApp()">Installera app</button>

</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
    <iframe id="frame" allow="autoplay"></iframe>
    <button onclick="closePlayer()">Stäng</button>
</div>

<script>

/* SERVICE WORKER */
window.addEventListener("load", () => {
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(reg => console.log("SW OK:", reg.scope))
            .catch(err => console.error(err));
    }
});

/* INSTALL */
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-block";
});

function installApp() {
    if (!deferredPrompt) return alert("Install ej tillgängligt");

    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById("installBtn").style.display = "none";
    });
}

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let currentIndex = 0;

/* ADD */
function addVideo() {
    const input = document.getElementById("videoInput").value;
    videos.push({ id: input });
    localStorage.setItem("videos", JSON.stringify(videos));
    load();
}

/* LOAD */
function load() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
        `;

        card.onclick = () => open(i);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(i, 1);
            localStorage.setItem("videos", JSON.stringify(videos));
            load();
        };

        grid.appendChild(card);
    });
}

/* PLAYER */
function open(i) {
    currentIndex = i;
    document.getElementById("player").style.display = "flex";
    document.getElementById("frame").src =
        `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

function closePlayer() {
    document.getElementById("player").style.display = "none";
    document.getElementById("frame").src = "";
}

/* SEARCH */
function searchLocal() {
    const q = document.getElementById("search").value.toLowerCase();
    load(videos.filter(v => v.id.toLowerCase().includes(q)));
}

/* HELP */
function showHelp() {
    alert("Lägg in YouTube ID eller länk");
}

load();

</script>

</body>
</html>
