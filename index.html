<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video Hub Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
}

/* TOPBAR */
.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #111;
    padding: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid #222;
    flex-wrap: wrap;
}

input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: white;
    outline: none;
    min-width: 180px;
}

input:focus {
    border-color: red;
}

button {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #ff0000;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
    background: #ff2a2a;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px;
}

/* CARD */
.card {
    background: #181818;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
    font-size: 13px;
    color: #ccc;
    word-break: break-word;
}

/* BUTTONS */
.delete, .fav {
    position: absolute;
    top: 8px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.delete {
    right: 8px;
    background: red;
    color: white;
}

.fav {
    left: 8px;
    background: gold;
    color: black;
}

/* PLAYER */
.player {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

iframe {
    width: min(900px, 95%);
    height: 70vh;
    border-radius: 12px;
}

/* HELP */
.helpModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
}

.helpBox {
    background: #111;
    padding: 20px;
    border-radius: 12px;
    max-width: 500px;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <input id="videoInput" placeholder="YouTube länk eller ID">
    <button onclick="addVideo()">Lägg till</button>

    <input id="search" placeholder="Sök i din lista">
    <button onclick="searchLocal()">Sök</button>

    <button onclick="showHelp()">How to use</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- PLAYER -->
<div class="player" id="player">
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>

    <div style="margin-top:10px; display:flex; gap:10px;">
        <button onclick="prev()">⬆</button>
        <button onclick="next()">⬇</button>
        <button onclick="closePlayer()">Stäng</button>
    </div>
</div>

<!-- HELP -->
<div class="helpModal" id="helpModal">
    <div class="helpBox">
        <h2>How to use</h2>
        <p>✔ Lägg till YouTube-länk eller ID</p>
        <p>✔ Klicka video för att spela</p>
        <p>✔ ★ = favorit</p>
        <p>✔ ✖ = ta bort</p>
        <button onclick="closeHelp()">Stäng</button>
    </div>
</div>

<script>

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let currentIndex = 0;

/* SAVE */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* VALIDATE */
function extractYouTubeID(input) {
    try {
        input = input.trim();
        const idRegex = /^[a-zA-Z0-9_-]{11}$/;

        if (idRegex.test(input)) return input;

        const url = new URL(input);

        if (url.hostname.includes("youtu.be")) {
            const id = url.pathname.slice(1);
            return idRegex.test(id) ? id : null;
        }

        if (url.hostname.includes("youtube.com")) {
            const id = url.searchParams.get("v");
            return idRegex.test(id) ? id : null;
        }

        return null;
    } catch {
        return null;
    }
}

/* ADD */
function addVideo() {
    const input = document.getElementById("videoInput").value;
    const id = extractYouTubeID(input);

    if (!id) return alert("❌ Ogiltig video");

    if (videos.some(v => v.id === id)) return alert("Finns redan");

    videos.push({ id });
    save();
    load();

    document.getElementById("videoInput").value = "";
}

/* FAVORITE */
function toggleFav(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    load();
}

/* LOAD */
function load(list = videos) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach((v, i) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${favorites.includes(v.id) ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div>${v.id}</div>
        `;

        card.onclick = () => open(i);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(i, 1);
            save();
            load();
        };

        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFav(v.id);
        };

        grid.appendChild(card);
    });
}

/* SEARCH */
function searchLocal() {
    const q = document.getElementById("search").value.toLowerCase();
    load(videos.filter(v => v.id.toLowerCase().includes(q)));
}

/* PLAYER */
function open(i) {
    currentIndex = i;
    document.getElementById("player").style.display = "flex";
    document.getElementById("frame").src =
        `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

function closePlayer() {
    document.getElementById("player").style.display = "none";
    document.getElementById("frame").src = "";
}

function next() {
    if (currentIndex < videos.length - 1) open(currentIndex + 1);
}

function prev() {
    if (currentIndex > 0) open(currentIndex - 1);
}

/* HELP */
function showHelp() {
    document.getElementById("helpModal").style.display = "flex";
}

function closeHelp() {
    document.getElementById("helpModal").style.display = "none";
}

/* INIT */
load();

</script>

</body>
</html>
