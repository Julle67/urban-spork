<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Youtube Video Storage</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#e50914;
  --text:#fff;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:#e50914;
}

.logo img{
  width:38px;
  height:38px;
  border-radius:10px;
}

.search{
  width:180px;
  padding:10px;
  border:none;
  border-radius:999px;
  background:#1f1f1f;
  color:white;
  outline:none;
}

/* HERO */
.hero{
  height:45vh;
  display:flex;
  align-items:flex-end;
  padding:30px;
  background:
  linear-gradient(to top,#000,transparent),
  url('https://images.unsplash.com/photo-1517602302552-471fe67acf66');
  background-size:cover;
  background-position:center;
}

.hero-content h1{ margin:0; font-size:40px; }
.hero-content p{ color:#ccc; max-width:500px; }

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding:18px;
}

.controls input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#1f1f1f;
  color:white;
}

.controls button{
  background:var(--accent);
  color:white;
  border:none;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:700;
}

/* SECTION */
.section{ padding:10px 18px; }
.section h2{ margin-bottom:10px; }

/* ROW */
.row{
  display:flex;
  gap:14px;
  overflow-x:auto;
}

/* CARD */
.card{
  min-width:230px;
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.card p{
  margin:0;
  padding:10px;
  font-size:13px;
}

/* BUTTONS */
.delete,.fav{
  position:absolute;
  top:8px;
  border:none;
  padding:5px 8px;
  cursor:pointer;
  border-radius:8px;
  z-index:5;
}

.delete{ right:8px; background:red; color:white; }
.fav{ left:8px; background:gold; }

/* PLAYER */
.player{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.player iframe{
  width:90%;
  height:70%;
  border:none;
  border-radius:16px;
}

/* FULLSCREEN BUTTON */
.fs-btn{
  position:absolute;
  bottom:20px;
  right:20px;
  z-index:1000;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#e50914;
  color:white;
  cursor:pointer;
  font-weight:700;
}

</style>
</head>

<body>

<div class="nav">
  <div class="logo">
    <img src="icon-512.png">
    <span>Youtube Video Storage</span>
  </div>

  <input class="search" id="searchInput" placeholder="Sök..." oninput="searchVideos()">
</div>

<div class="hero">
  <div class="hero-content">
    <h1>Your Video Library</h1>
    <p>Save, organize and watch your favorite YouTube videos.</p>
  </div>
</div>

<div class="controls">
  <input id="videoInput" placeholder="YouTube länk eller video-ID">
  <button onclick="addVideo()">Lägg till</button>
</div>

<div class="section">
  <h2>🎬 Alla Videos</h2>
  <div class="row" id="allRow"></div>
</div>

<div class="player" id="player">
  <iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <button class="fs-btn" onclick="toggleFullscreen(event)">⛶</button>
</div>

<script>

/* ===== FULL ORIGINAL FUNCTIONALITY RESTORED ===== */

let videos = JSON.parse(localStorage.getItem("videos")) || [];

function extractYouTubeID(input){
  try{
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const url = new URL(input);
    if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
    if(url.hostname.includes("youtube.com")) return url.searchParams.get("v");
  }catch{}
  return null;
}

async function addVideo(){
  const id = extractYouTubeID(videoInput.value);
  if(!id) return alert("Ogiltig video");

  videos.unshift({ id, title:"YouTube Video", fav:false });
  videoInput.value="";
  save();
  render();
}

function openVideo(id){
  player.style.display="flex";
  frame.src=`https://www.youtube.com/embed/${id}?autoplay=1&fs=1`;
}

function closePlayer(){
  player.style.display="none";
  frame.src="";
  if(document.fullscreenElement) document.exitFullscreen();
}

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

function render(){
  allRow.innerHTML="";
  videos.forEach(v=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
      <p>${v.title}</p>
    `;
    div.onclick=()=>openVideo(v.id);
    allRow.appendChild(div);
  });
}

/* FULLSCREEN (ONLY ADD) */
function toggleFullscreen(e){
  if(e) e.stopPropagation();
  const el=player;
  if(!document.fullscreenElement){
    el.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

player.addEventListener("dblclick",toggleFullscreen);

document.addEventListener("keydown",(e)=>{
  if(e.key.toLowerCase()==="f") toggleFullscreen();
  if(e.key==="Escape") closePlayer();
});

render();

</script>

</body>
</html>
