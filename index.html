<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Youtube Unblocked</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

/* LOGIN BAR */
#auth {
    padding: 10px;
    background: #111;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
}

input {
    padding: 10px;
    border-radius: 4px;
    border: none;
}

button {
    padding: 10px;
    background: red;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

/* HEADER */
header {
    padding: 15px;
    background: #202020;
    display: flex;
    justify-content: center;
    gap: 10px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.thumbnail {
    width: 100%;
}

.title {
    padding: 10px;
    font-size: 14px;
}

/* DELETE */
.delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: none;
    color: white;
    cursor: pointer;
    padding: 5px;
    border-radius: 5px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
    <input id="username" placeholder="Användarnamn">
    <input id="password" type="password" placeholder="Lösenord">
    <button onclick="register()">Registrera</button>
    <button onclick="login()">Logga in</button>
    <span id="currentUser"></span>
</div>

<!-- UPLOAD -->
<header>
    <input type="text" id="videoId" placeholder="YouTube ID">
    <button onclick="addVideo()">Lägg till video</button>
</header>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
    <span class="close" onclick="closeVideo()">✖</span>
    <iframe id="player" src="" allowfullscreen></iframe>
</div>

<script>
/* ---------------- USERS ---------------- */
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = localStorage.getItem("currentUser") || null;

function saveUsers() {
    localStorage.setItem("users", JSON.stringify(users));
}

function updateUI() {
    document.getElementById("currentUser").innerText =
        currentUser ? "Inloggad: " + currentUser : "Inte inloggad";
}

updateUI();

/* ---------------- AUTH ---------------- */
function register() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) return alert("Fyll i allt");

    if (users.find(u => u.username === username)) {
        return alert("Användaren finns redan");
    }

    users.push({ username, password });
    saveUsers();
    alert("Konto skapat!");
}

function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const user = users.find(u => u.username === username && u.password === password);

    if (!user) return alert("Fel inloggning");

    currentUser = username;
    localStorage.setItem("currentUser", currentUser);
    updateUI();
}

/* ---------------- VIDEOS ---------------- */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

function addVideo() {
    if (!currentUser) return alert("Logga in först!");

    const id = document.getElementById("videoId").value;
    if (!id) return;

    const videoObj = {
        id: id,
        owner: currentUser
    };

    videos.push(videoObj);
    saveVideos();
    createCard(videoObj);

    document.getElementById("videoId").value = "";
}

function createCard(video) {
    const card = document.createElement("div");
    card.className = "card";

    const thumbnail = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;

    card.innerHTML = `
        ${video.owner === currentUser ? '<button class="delete">✖</button>' : ''}
        <img class="thumbnail" src="${thumbnail}">
        <div class="title">${video.id} (av ${video.owner})</div>
    `;

    card.onclick = () => openVideo(video.id);

    if (video.owner === currentUser) {
        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos = videos.filter(v => v !== video);
            saveVideos();
            card.remove();
        };
    }

    document.getElementById("grid").appendChild(card);
}

/* ---------------- PLAYER ---------------- */
function openVideo(id) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("player").src =
        `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function closeVideo() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
}

/* LOAD VIDEOS */
videos.forEach(v => createCard(v));
</script>

</body>
</html>
