<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

input, button {
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: red;
    color: white;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.card img {
    width: 100%;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="search" placeholder="Sök YouTube">
    <button onclick="searchVideos()">Sök</button>
</div>

<div id="results" class="grid"></div>

<div class="modal" id="modal">
    <iframe id="player" allowfullscreen></iframe>
</div>

<script>

/* ================= SIMPLE SEARCH (NO API) ================= */
async function searchVideos() {
    const query = document.getElementById("search").value;
    const results = document.getElementById("results");

    if (!query) return;

    results.innerHTML = "Söker...";

    try {
        // YouTube search redirect trick (works without API)
        const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;

        const res = await fetch(url);
        const text = await res.text();

        const videoIds = [...text.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

        results.innerHTML = "";

        const unique = [...new Set(videoIds)].slice(0, 12);

        unique.forEach(id => {
            const div = document.createElement("div");
            div.className = "card";

            div.innerHTML = `
                <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
                <p style="padding:10px">${id}</p>
            `;

            div.onclick = () => openVideo(id);

            results.appendChild(div);
        });

        if (!unique.length) {
            results.innerHTML = "<p>Inga resultat hittades</p>";
        }

    } catch (err) {
        console.log(err);
        results.innerHTML = "<p style='color:red'>Blockerad av nätverk</p>";
    }
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

</script>

</body>
</html>
