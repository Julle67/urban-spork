<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}

input {
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.card img {
    width: 100%;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="videoId" placeholder="YouTube ID (t.ex dQw4w9WgXcQ)">
    <button onclick="addVideo()">Lägg till</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>

/* ================= DATA ================= */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* ================= ADD VIDEO ================= */
function addVideo() {
    const input = document.getElementById("videoId");
    const id = input.value.trim();

    if (!id) return;

    videos.push({ id });

    saveVideos();
    loadVideos();

    input.value = "";
}

/* ================= LOAD ================= */
function loadVideos() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div style="padding:10px">${v.id}</div>
        `;

        card.onclick = () => openVideo(v.id);

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* CLOSE */
document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

/* INIT */
loadVideos();

</script>

</body>
</html>
