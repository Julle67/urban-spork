<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Youtube Video Storage</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#e50914;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#1a1a1a,#0b0b0b 60%);
  color:var(--text);
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:var(--accent);
}

.logo img{
  width:36px;
  height:36px;
  border-radius:10px;
}

.nav input{
  background:#1f1f1f;
  border:none;
  padding:8px 12px;
  border-radius:999px;
  color:white;
  outline:none;
}

/* HERO */
.hero{
  height:45vh;
  display:flex;
  align-items:flex-end;
  padding:30px;
  background:
    linear-gradient(to top,#000,transparent),
    url('https://images.unsplash.com/photo-1517602302552-471fe67acf66');
  background-size:cover;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding:15px 20px;
}

.controls input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#1f1f1f;
  color:white;
}

.controls button{
  background:var(--accent);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* SECTIONS */
.section{
  padding:10px 20px;
}

.section h2{
  font-size:16px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
  scroll-snap-type:x mandatory;
}

/* CARD */
.card{
  min-width:180px;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:0.25s;
  scroll-snap-align:start;
}

.card:hover{
  transform:scale(1.1);
  z-index:2;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.card p{
  padding:6px;
  font-size:12px;
  margin:0;
  opacity:0.8;
}

/* PLAYER */
.player{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

iframe{
  width:90%;
  height:65%;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">
    <img src="icon-512.png" alt="logo">
    <span>Youtube Video Storage</span>
  </div>

  <input id="search" placeholder="Sök..." oninput="searchLocal()">
</div>

<div class="hero"></div>

<div class="controls">
  <input id="videoInput" placeholder="YouTube länk eller ID">
  <button onclick="addVideo()">Lägg till</button>
</div>

<div class="section">
  <h2>🔥 Trending</h2>
  <div class="row" id="trendingRow"></div>
</div>

<div class="section">
  <h2>⭐ Favoriter</h2>
  <div class="row" id="favRow"></div>
</div>

<div class="section">
  <h2>🎬 Alla videos</h2>
  <div class="row" id="allRow"></div>
</div>

<div class="player" id="player">
  <iframe id="frame" allow="autoplay"></iframe>
</div>

<script>

/* PWA */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

/* YOUTUBE ID */
function extractYouTubeID(input){
  try{
    const idRegex=/^[a-zA-Z0-9_-]{11}$/;
    if(idRegex.test(input)) return input;
    const url=new URL(input);
    if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
    if(url.hostname.includes("youtube.com")) return url.searchParams.get("v");
  }catch{}
  return null;
}

/* ADD */
function addVideo(){
  const id = extractYouTubeID(videoInput.value);
  if(!id) return alert("Ogiltig video");

  videos.unshift({id,title:id,fav:false});
  save();
  render();
}

/* OPEN */
function open(id){
  player.style.display="flex";
  frame.src=`https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* SEARCH */
function searchLocal(){
  const q = search.value.toLowerCase();
  render(videos.filter(v=>v.id.toLowerCase().includes(q)));
}

/* RENDER */
function render(list = videos){

  trendingRow.innerHTML="";
  favRow.innerHTML="";
  allRow.innerHTML="";

  list.forEach((v,i)=>{

    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
      <p>${v.title}</p>
    `;

    card.onclick=()=>open(v.id);

    // ALL
    allRow.appendChild(card.cloneNode(true));
    allRow.lastChild.onclick=()=>open(v.id);

    // FAVORITES
    if(v.fav){
      const f = card.cloneNode(true);
      f.onclick=()=>open(v.id);
      favRow.appendChild(f);
    }

    // TRENDING
    if(i < 10){
      const t = card.cloneNode(true);
      t.onclick=()=>open(v.id);
      trendingRow.appendChild(t);
    }
  });
}

render();

</script>

</body>
</html>
