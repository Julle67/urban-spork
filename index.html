<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Youtube Video Storage</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#e50914;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0b0b0b;
  color:var(--text);
}

/* 🔥 CINEMATIC SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,#1a1a1a,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 0.6s ease 2.2s forwards;
}

.splash-content{
  text-align:center;
  animation:zoomIn 1s ease;
}

#splash img{
  width:130px;
  height:130px;
  border-radius:20px;
  box-shadow:0 0 60px rgba(229,9,20,0.6);
}

#splash h1{
  margin-top:15px;
  color:#e50914;
  font-size:22px;
}

#splash p{
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}

@keyframes zoomIn{
  from{transform:scale(0.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:#e50914;
}

.logo img{
  width:34px;
  height:34px;
  border-radius:8px;
}

/* INPUT */
.controls{
  display:flex;
  gap:10px;
  padding:15px;
}

.controls input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#1f1f1f;
  color:white;
}

.controls button{
  background:#e50914;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* ROW */
.row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:10px 15px;
}

/* CARD */
.card{
  min-width:180px;
  background:#141414;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.08);
}

.card img{
  width:100%;
}

.card p{
  font-size:12px;
  padding:6px;
  margin:0;
}

/* BUTTONS */
.delete,.fav{
  position:absolute;
  top:6px;
  border:none;
  padding:4px 6px;
  cursor:pointer;
}

.delete{right:6px;background:red;color:white}
.fav{left:6px;background:gold}

/* PLAYER */
.player{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1000;
}

iframe{
  width:90%;
  height:65%;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- 🔥 SPLASH -->
<div id="splash">
  <div class="splash-content">
    <img src="icon-512.png">
    <h1>Youtube Video Storage</h1>
    <p>Loading your videos...</p>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="logo">
    <img src="icon-512.png">
    <span>Video Storage</span>
  </div>
</div>

<!-- INPUT -->
<div class="controls">
  <input id="videoInput" placeholder="YouTube länk eller ID">
  <button onclick="addVideo()">Lägg till</button>
</div>

<!-- LIST -->
<h3 style="padding:0 15px;">🎬 Videos</h3>
<div class="row" id="allRow"></div>

<h3 style="padding:0 15px;">⭐ Favoriter</h3>
<div class="row" id="favRow"></div>

<!-- PLAYER -->
<div class="player" id="player">
  <iframe id="frame" allow="autoplay"></iframe>
</div>

<script>

/* 🔥 SAFE SPLASH REMOVE */
window.addEventListener("load", () => {
  const splash = document.getElementById("splash");
  setTimeout(() => {
    if (splash) splash.style.display = "none";
  }, 2200);
});

/* PWA */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function save(){
  localStorage.setItem("videos",JSON.stringify(videos));
}

/* ID */
function extractYouTubeID(input){
  try{
    const regex=/^[a-zA-Z0-9_-]{11}$/;
    if(regex.test(input)) return input;
    const url=new URL(input);
    if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
    if(url.hostname.includes("youtube.com")) return url.searchParams.get("v");
  }catch{}
  return null;
}

/* ADD */
function addVideo(){
  const id=extractYouTubeID(videoInput.value);
  if(!id) return alert("Ogiltig video");

  videos.unshift({id,fav:false});
  save();
  render();
}

/* OPEN */
function openVideo(id){
  player.style.display="flex";
  frame.src=`https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* CLICK OUTSIDE TO CLOSE */
document.getElementById("player").addEventListener("click",(e)=>{
  if(e.target.id==="player"){
    player.style.display="none";
    frame.src="";
  }
});

/* FAVORITE */
function toggleFav(i){
  videos[i].fav=!videos[i].fav;
  save();
  render();
}

/* DELETE */
function removeVideo(i){
  videos.splice(i,1);
  save();
  render();
}

/* RENDER */
function render(){

  allRow.innerHTML="";
  favRow.innerHTML="";

  videos.forEach((v,i)=>{

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <button class="delete">✖</button>
      <button class="fav">${v.fav?"★":"☆"}</button>
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
      <p>${v.id}</p>
    `;

    card.onclick=()=>openVideo(v.id);

    card.querySelector(".delete").onclick=(e)=>{
      e.stopPropagation();
      removeVideo(i);
    };

    card.querySelector(".fav").onclick=(e)=>{
      e.stopPropagation();
      toggleFav(i);
    };

    allRow.appendChild(card);

    if(v.fav){
      const f=card.cloneNode(true);
      f.onclick=()=>openVideo(v.id);
      favRow.appendChild(f);
    }
  });
}

render();

</script>

</body>
</html>
