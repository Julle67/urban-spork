<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Youtube Video Storage</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#e50914;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

/* SPLASH */

#splash{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#1a1a1a,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.splash-content{
  text-align:center;
}

.splash-content img{
  width:120px;
  border-radius:20px;
}

.splash-content h1{
  color:#e50914;
}

/* NAV */

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:800;
  color:#e50914;
}

.logo img{
  width:38px;
  border-radius:8px;
}

.search{
  padding:10px;
  border-radius:999px;
  border:none;
  background:#1f1f1f;
  color:white;
}

/* HERO */

.hero{
  height:40vh;
  background:
  linear-gradient(to top,#000,transparent),
  url('icon-512.png');
  background-size:cover;
  background-position:center;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:10px;
  padding:15px;
}

.controls input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1f1f1f;
  color:white;
}

.controls button{
  background:var(--accent);
  border:none;
  color:white;
  padding:12px 16px;
  border-radius:10px;
}

/* ROW */

.row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:10px;
}

/* CARD */

.card{
  min-width:200px;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

.card img{
  width:100%;
}

.card p{
  padding:8px;
  margin:0;
}

.delete,.fav{
  position:absolute;
  top:6px;
  border:none;
  padding:5px;
  cursor:pointer;
}

.delete{right:6px;background:red;color:white}
.fav{left:6px;background:gold}

/* PROGRESS */

.progress-wrap{
  height:4px;
  background:#222;
}

.progress-bar{
  height:100%;
  background:#e50914;
}

/* PLAYER FULLSCREEN FIX */

.player{
  display:none;
  position:fixed;
  inset:0;
  background:black;
  z-index:999;
}

.player iframe{
  width:100%;
  height:100%;
  border:none;
}

/* CLOSE BUTTON */

.close{
  position:absolute;
  top:15px;
  right:15px;
  z-index:1000;
  background:red;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-content">
    <img src="icon-512.png">
    <h1>Youtube Video Storage</h1>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="logo">
    <img src="icon-512.png">
    Youtube Video Storage
  </div>
  <input class="search" id="searchInput" placeholder="Sök..." oninput="searchVideos()">
</div>

<!-- HERO -->
<div class="hero"></div>

<!-- CONTROLS -->
<div class="controls">
  <input id="videoInput" placeholder="YouTube länk eller ID">
  <button onclick="addVideo()">Lägg till</button>
</div>

<!-- ROW -->
<div class="row" id="allRow"></div>

<!-- PLAYER -->
<div class="player" id="player" onclick="closePlayer(event)">
  <button class="close" onclick="closePlayer(event)">✖</button>
  <iframe id="frame" allow="autoplay; fullscreen"></iframe>
</div>

<script>

/* SPLASH */
window.onload=()=>{
  setTimeout(()=>document.getElementById("splash").style.display="none",2000);
};

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let watchProgress = JSON.parse(localStorage.getItem("watchProgress")) || {};

/* SAVE */
function save(){
  localStorage.setItem("videos",JSON.stringify(videos));
  localStorage.setItem("watchProgress",JSON.stringify(watchProgress));
}

/* YOUTUBE ID */
function getID(input){
  try{
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const url=new URL(input);
    return url.searchParams.get("v") || url.pathname.slice(1);
  }catch{return null}
}

/* TITLE */
async function title(id){
  try{
    const r=await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
    const d=await r.json();
    return d.title;
  }catch{return "Video"}
}

/* ADD */
async function addVideo(){
  const id=getID(videoInput.value);
  if(!id) return alert("Fel video");

  videos.unshift({
    id,
    title:await title(id),
    fav:false
  });

  videoInput.value="";
  save();
  render();
}

/* OPEN */
function openVideo(id){
  player.style.display="block";
  frame.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1`;
}

/* CLOSE */
function closePlayer(e){
  if(e) e.stopPropagation();
  player.style.display="none";
  frame.src="";
}

/* RENDER */
function render(){
  allRow.innerHTML="";

  videos.forEach((v,i)=>{
    const c=document.createElement("div");
    c.className="card";

    c.innerHTML=`
      <button class="delete">✖</button>
      <button class="fav">${v.fav?"★":"☆"}</button>
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${watchProgress[v.id]||0}%"></div>
      </div>
      <p>${v.title}</p>
    `;

    c.onclick=()=>openVideo(v.id);

    c.querySelector(".delete").onclick=(e)=>{
      e.stopPropagation();
      videos.splice(i,1);
      save();
      render();
    };

    c.querySelector(".fav").onclick=(e)=>{
      e.stopPropagation();
      v.fav=!v.fav;
      save();
      render();
    };

    allRow.appendChild(c);
  });
}

render();

</script>

</body>
</html>
