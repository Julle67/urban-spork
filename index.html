<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Youtube unblocked</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

/* TOP BAR */
.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
}

/* LOGIN PANEL (hidden by default) */
#loginPanel {
    display: none;
    position: absolute;
    top: 60px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
}

/* INPUTS */
input {
    padding: 10px;
    border-radius: 5px;
    border: none;
    margin: 5px;
}

button {
    padding: 10px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
}

.delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: none;
    color: white;
    cursor: pointer;
    padding: 5px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <button onclick="toggleLogin()">Logga in / Konto</button>

    <span id="userText"></span>

    <input id="videoId" placeholder="YouTube ID">
    <button onclick="addVideo()">Lägg till video</button>

</div>

<!-- LOGIN PANEL -->
<div id="loginPanel">
    <input id="username" placeholder="Användarnamn"><br>
    <input id="password" type="password" placeholder="Lösenord"><br>
    <button onclick="register()">Skapa konto</button>
    <button onclick="login()">Logga in</button>
</div>

<!-- VIDEOS -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
    <iframe id="player"></iframe>
</div>

<script>

/* DATA */
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = localStorage.getItem("currentUser") || null;
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function saveUsers() {
    localStorage.setItem("users", JSON.stringify(users));
}

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* LOGIN UI TOGGLE */
function toggleLogin() {
    const panel = document.getElementById("loginPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
}

/* AUTH */
function register() {
    const u = username.value;
    const p = password.value;

    if (!u || !p) return alert("Fyll i allt");

    if (users.find(x => x.username === u))
        return alert("Finns redan");

    users.push({ username: u, password: p });
    saveUsers();
    alert("Konto skapat!");
}

function login() {
    const u = username.value;
    const p = password.value;

    const user = users.find(x => x.username === u && x.password === p);

    if (!user) return alert("Fel login");

    currentUser = u;
    localStorage.setItem("currentUser", currentUser);

    updateUI();
}

/* UI */
function updateUI() {
    userText.innerText = currentUser ? "Inloggad: " + currentUser : "Inte inloggad";
}

updateUI();

/* ADD VIDEO (ONLY LOGGED IN) */
function addVideo() {
    if (!currentUser) return alert("Logga in först!");

    const id = videoId.value;
    if (!id) return;

    const video = {
        id,
        owner: currentUser
    };

    videos.push(video);
    saveVideos();
    createCard(video);

    videoId.value = "";
}

/* CARD */
function createCard(video) {
    const card = document.createElement("div");
    card.className = "card";

    const thumb = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;

    card.innerHTML = `
        ${video.owner === currentUser ? '<button class="delete">✖</button>' : ''}
        <img class="thumbnail" src="${thumb}">
        <div style="padding:10px">
            ${video.id} <br>
            <small>${video.owner}</small>
        </div>
    `;

    card.onclick = () => openVideo(video.id);

    if (video.owner === currentUser) {
        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos = videos.filter(v => v !== video);
            saveVideos();
            card.remove();
        };
    }

    grid.appendChild(card);
}

/* PLAYER */
function openVideo(id) {
    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}`;
}

modal.onclick = () => {
    modal.style.display = "none";
    player.src = "";
};

/* LOAD */
videos.forEach(v => createCard(v));

</script>

</body>
</html>
