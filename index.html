<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Youtube Video Storage</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#e50914;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#1a1a1a,#0b0b0b 60%);
  color:var(--text);
}

/* 🔥 SPLASH SCREEN */
#splash{
  position:fixed;
  inset:0;
  background:#0b0b0b;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  animation:fadeOut 1s ease 2.5s forwards;
}

#splash img{
  width:120px;
  height:120px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(229,9,20,0.5);
  animation:pop 1s ease;
}

#splash h1{
  margin-top:15px;
  color:#e50914;
  font-size:20px;
  letter-spacing:1px;
}

@keyframes pop{
  from{transform:scale(0.6);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

/* LOGO FIX */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:var(--accent);
}

.logo img{
  width:36px;
  height:36px;
  border-radius:10px;
  object-fit:cover;
  box-shadow:0 0 12px rgba(229,9,20,0.5);
}

.nav input{
  background:#1f1f1f;
  border:none;
  padding:8px 12px;
  border-radius:999px;
  color:white;
  outline:none;
}

/* HERO */
.hero{
  height:45vh;
  display:flex;
  align-items:flex-end;
  padding:30px;
  background:
    linear-gradient(to top, #000, transparent),
    url('https://images.unsplash.com/photo-1517602302552-471fe67acf66');
  background-size:cover;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding:15px 20px;
}

.controls input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#1f1f1f;
  color:white;
}

.controls button{
  background:var(--accent);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* ROW */
.section{
  padding:20px;
}

.row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

/* CARD */
.card{
  min-width:200px;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:scale(1.07);
}

.card img{
  width:100%;
}

.card p{
  padding:8px;
  font-size:13px;
  margin:0;
}

.delete,.fav{
  position:absolute;
  top:6px;
  border:none;
  padding:4px 6px;
  cursor:pointer;
}

.delete{right:6px;background:red;color:white}
.fav{left:6px;background:gold}

/* PLAYER */
.player{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

iframe{
  width:90%;
  height:65%;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- 🔥 SPLASH SCREEN -->
<div id="splash">
  <img src="icon-512.png" alt="logo">
  <h1>Youtube Video Storage</h1>
</div>

<div class="nav">

  <div class="logo">
    <img src="icon-512.png" alt="logo">
    <span>YoutubeVideoStorage</span>
  </div>

  <input id="search" placeholder="Sök..." oninput="searchLocal()">
</div>

<div class="hero"></div>

<div class="controls">
  <input id="videoInput" placeholder="YouTube länk eller ID">
  <button onclick="addVideo()">Lägg till</button>
</div>

<div class="section">
  <h2>🎬 Bibliotek</h2>
  <div class="row" id="allRow"></div>
</div>

<div class="player" id="player">
  <iframe id="frame" allow="autoplay"></iframe>
</div>

<script>

/* SPLASH REMOVE */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
  }, 2500);
});

/* PWA */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function save(){
  localStorage.setItem("videos", JSON.stringify(videos));
}

/* YT ID */
function extractYouTubeID(input){
  try{
    const idRegex=/^[a-zA-Z0-9_-]{11}$/;
    if(idRegex.test(input)) return input;
    const url=new URL(input);
    if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
    if(url.hostname.includes("youtube.com")) return url.searchParams.get("v");
  }catch{}
  return null;
}

/* ADD */
function addVideo(){
  const id=extractYouTubeID(videoInput.value);
  if(!id) return alert("Ogiltig video");

  videos.unshift({id,title:id,fav:false});
  save();
  render();
}

/* RENDER */
function render(){
  allRow.innerHTML="";

  videos.forEach((v,i)=>{
    const c=document.createElement("div");
    c.className="card";

    c.innerHTML=`
      <button class="delete">✖</button>
      <button class="fav">${v.fav?"★":"☆"}</button>
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
      <p>${v.title}</p>
    `;

    c.onclick=()=>open(v.id);

    c.querySelector(".delete").onclick=e=>{
      e.stopPropagation();
      videos.splice(i,1);
      save(); render();
    };

    c.querySelector(".fav").onclick=e=>{
      e.stopPropagation();
      v.fav=!v.fav;
      save(); render();
    };

    allRow.appendChild(c);
  });
}

/* PLAYER */
function open(id){
  player.style.display="flex";
  frame.src=`https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* SEARCH */
function searchLocal(){
  const q=search.value.toLowerCase();
  allRow.innerHTML="";
  videos
    .filter(v=>v.id.toLowerCase().includes(q))
    .forEach(v=>{
      const c=document.createElement("div");
      c.className="card";
      c.innerHTML=`
        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
        <p>${v.title}</p>`;
      c.onclick=()=>open(v.id);
      allRow.appendChild(c);
    });
}

render();

</script>

</body>
</html>
