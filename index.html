<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Youtube unblocked</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

header {
    padding: 15px;
    background: #202020;
    display: flex;
    justify-content: center;
    gap: 10px;
}

input {
    padding: 10px;
    width: 300px;
    border-radius: 4px;
    border: none;
}

button {
    padding: 10px;
    background: red;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.thumbnail {
    width: 100%;
}

.title {
    padding: 10px;
    font-size: 14px;
}

/* delete button */
.delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: none;
    color: white;
    cursor: pointer;
    padding: 5px;
    border-radius: 5px;
}

/* modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <input type="text" id="videoId" placeholder="YouTube ID (t.ex EeSlGlaK-Cg)">
    <button onclick="addVideo()">Lägg till</button>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
    <span class="close" onclick="closeVideo()">✖</span>
    <iframe id="player" src="" allowfullscreen></iframe>
</div>

<script>
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

function createCard(id) {
    const card = document.createElement("div");
    card.className = "card";

    const thumbnail = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

    card.innerHTML = `
        <button class="delete">✖</button>
        <img class="thumbnail" src="${thumbnail}">
        <div class="title">Video ID: ${id}</div>
    `;

    card.onclick = () => openVideo(id);

    // delete knapp
    card.querySelector(".delete").onclick = (e) => {
        e.stopPropagation();
        videos = videos.filter(v => v !== id);
        saveVideos();
        card.remove();
    };

    document.getElementById("grid").appendChild(card);
}

function addVideo() {
    const id = document.getElementById("videoId").value;
    if (!id) return;

    videos.push(id);
    saveVideos();
    createCard(id);

    document.getElementById("videoId").value = "";
}

function openVideo(id) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("player").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function closeVideo() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
}

// ladda sparade videos när sidan startar
videos.forEach(id => createCard(id));
</script>

</body>
</html>
