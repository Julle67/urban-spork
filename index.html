<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

/* TOP BAR */
.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
}

input {
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

/* LOGIN PANEL */
#loginPanel {
    display: none;
    position: absolute;
    top: 60px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
}

/* DELETE BUTTON */
.delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: none;
    color: white;
    cursor: pointer;
    padding: 5px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

    <button onclick="toggleLogin()">Logga in / Konto</button>

    <span id="userText"></span>

    <input id="videoId" placeholder="YouTube ID">
    <button onclick="addVideo()">Lägg till</button>

</div>

<!-- LOGIN -->
<div id="loginPanel">
    <input id="username" placeholder="Användarnamn"><br><br>
    <input id="password" type="password" placeholder="Lösenord"><br><br>
    <button onclick="register()">Skapa konto</button>
    <button onclick="login()">Logga in</button>
</div>

<!-- VIDEOS -->
<div class="grid" id="grid"></div>

<!-- PLAYER -->
<div class="modal" id="modal">
    <iframe id="player"></iframe>
</div>

<script>

/* DATA */
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = localStorage.getItem("currentUser") || null;
let videos = JSON.parse(localStorage.getItem("videos")) || [];

/* SAVE */
function saveUsers() {
    localStorage.setItem("users", JSON.stringify(users));
}

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* LOGIN PANEL */
function toggleLogin() {
    const p = document.getElementById("loginPanel");
    p.style.display = p.style.display === "block" ? "none" : "block";
}

/* AUTH */
function register() {
    const u = username.value;
    const p = password.value;

    if (!u || !p) return alert("Fyll i allt");

    if (users.find(x => x.username === u))
        return alert("Finns redan");

    users.push({ username: u, password: p });
    saveUsers();
    alert("Konto skapat!");
}

function login() {
    const u = username.value;
    const p = password.value;

    const user = users.find(x => x.username === u && x.password === p);

    if (!user) return alert("Fel login");

    currentUser = u;
    localStorage.setItem("currentUser", currentUser);

    refresh();
}

/* UI */
function updateUI() {
    userText.innerText = currentUser ? "Inloggad: " + currentUser : "Inte inloggad";
}

/* VIDEO ADD */
function addVideo() {
    if (!currentUser) return alert("Du måste logga in!");

    const id = videoId.value;
    if (!id) return;

    videos.push({
        id,
        owner: currentUser
    });

    saveVideos();
    refresh();

    videoId.value = "";
}

/* RENDER FIX (VIKTIG) */
function loadVideos() {
    grid.innerHTML = "";

    videos.forEach(video => {
        const card = document.createElement("div");
        card.className = "card";

        const thumb = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;

        card.innerHTML = `
            <img class="thumbnail" src="${thumb}">
            <div style="padding:10px">
                ${video.id}<br>
                <small>av ${video.owner}</small>
            </div>
        `;

        card.onclick = () => openVideo(video.id);

        if (currentUser && video.owner === currentUser) {
            const del = document.createElement("button");
            del.className = "delete";
            del.innerText = "✖";

            del.onclick = (e) => {
                e.stopPropagation();
                videos = videos.filter(v => v !== video);
                saveVideos();
                refresh();
            };

            card.appendChild(del);
        }

        grid.appendChild(card);
    });
}

/* PLAYER */
function openVideo(id) {
    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}`;
}

modal.onclick = () => {
    modal.style.display = "none";
    player.src = "";
};

/* REFRESH SYSTEM */
function refresh() {
    updateUI();
    loadVideos();
}

/* AUTO LOGIN */
if (currentUser) refresh();
else loadVideos();

</script>

</body>
</html>
