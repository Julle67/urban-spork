<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video Manager</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.topbar {
    padding: 12px;
    background: #111;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
    font-weight: bold;
}

.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
}

.tab {
    padding: 8px 12px;
    background: #222;
    border-radius: 8px;
    cursor: pointer;
}

.tab.active {
    background: red;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
    font-size: 14px;
}

.delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: red;
    border: none;
    color: white;
    padding: 4px 6px;
    border-radius: 6px;
}

.fav {
    position: absolute;
    top: 6px;
    left: 6px;
    background: gold;
    border: none;
    color: black;
    padding: 4px 6px;
    border-radius: 6px;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
    border: none;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="search" placeholder="Sök video">
    <button onclick="searchVideos()">Sök</button>
    <button onclick="addRandom()">+ Random video</button>
</div>

<div class="tabs">
    <div class="tab active" onclick="showTab('all')">Alla</div>
    <div class="tab" onclick="showTab('fav')">Favoriter</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>

/* ================= DATA ================= */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let currentTab = "all";

/* ================= SAVE ================= */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* ================= RANDOM LIBRARY ================= */
const library = [
    "dQw4w9WgXcQ",
    "9bZkp7q19f0",
    "kJQP7kiw5Fk",
    "3JZ_D3ELwOQ",
    "fJ9rUzIMcZQ",
    "J---aiyznGQ",
    "eBGIQ7ZuuiU"
];

/* ================= ADD RANDOM ================= */
function addRandom() {
    const id = library[Math.floor(Math.random() * library.length)];
    videos.push({ id });
    save();
    loadVideos();
}

/* ================= FAVORITE ================= */
function toggleFav(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    loadVideos();
}

/* ================= SEARCH (SMART FILTER) ================= */
function searchVideos() {
    const q = document.getElementById("search").value.toLowerCase();

    let results = library.filter(id => id.includes(q));

    if (results.length === 0) results = library;

    render(results);
}

/* ================= TABS ================= */
function showTab(tab) {
    currentTab = tab;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");

    loadVideos();
}

/* ================= LOAD ================= */
function loadVideos() {
    if (currentTab === "fav") {
        render(videos.filter(v => favorites.includes(v.id)).map(v => v.id));
    } else {
        render(videos.map(v => v.id));
    }
}

/* ================= RENDER ================= */
function render(list) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach(id => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${favorites.includes(id) ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
            <div>${id}</div>
        `;

        card.onclick = () => openVideo(id);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos = videos.filter(v => v.id !== id);
            save();
            loadVideos();
        };

        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFav(id);
        };

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

/* INIT */
loadVideos();

</script>

</body>
</html>
