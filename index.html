<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 25px; /* rundade hörn */
      background: linear-gradient(45deg, #4CAF50, #45a049);
      color: white;
      transition: all 0.3s ease; /* animation */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.1); /* växer lite */
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.95); /* tryck-effekt */
    }
  </style>
</head>
<body>

  <button>Click me!</button>

</body>
</html>
