<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.topbar {
    padding: 12px;
    background: #111;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
    font-size: 14px;
}

/* buttons */
.delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: red;
    border: none;
    color: white;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
}

.fav {
    position: absolute;
    top: 6px;
    left: 6px;
    background: gold;
    border: none;
    color: black;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
}

/* modal */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: 80%;
    height: 80%;
    border: none;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <input id="username" placeholder="Ditt namn">
    <button onclick="setUser()">Logga in</button>

    <input id="search" placeholder="Sök YouTube">
    <button onclick="searchVideos()">Sök</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>

/* ================= USER ================= */
let currentUser = localStorage.getItem("currentUser") || "";

let videos = JSON.parse(localStorage.getItem("videos_" + currentUser)) || [];
let favorites = JSON.parse(localStorage.getItem("fav_" + currentUser)) || [];

/* ================= SAVE ================= */
function save() {
    localStorage.setItem("videos_" + currentUser, JSON.stringify(videos));
    localStorage.setItem("fav_" + currentUser, JSON.stringify(favorites));
}

/* ================= LOGIN ================= */
function setUser() {
    const name = document.getElementById("username").value.trim();
    if (!name) return;

    currentUser = name;

    localStorage.setItem("currentUser", currentUser);

    videos = JSON.parse(localStorage.getItem("videos_" + currentUser)) || [];
    favorites = JSON.parse(localStorage.getItem("fav_" + currentUser)) || [];

    loadVideos();
}

/* ================= ADD VIDEO ================= */
function addVideo(id) {
    videos.push({ id });
    save();
    loadVideos();
}

/* ================= FAVORITE ================= */
function toggleFavorite(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    loadVideos();
}

/* ================= SEARCH (NO API) ================= */
async function searchVideos() {
    const query = document.getElementById("search").value;
    const grid = document.getElementById("grid");

    if (!query) return;

    grid.innerHTML = "Söker...";

    try {
        const res = await fetch(
            `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`
        );

        const html = await res.text();

        const ids = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);
        const unique = [...new Set(ids)].slice(0, 12);

        grid.innerHTML = "";

        unique.forEach(id => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <button class="delete">✖</button>
                <button class="fav">${favorites.includes(id) ? "★" : "☆"}</button>
                <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
                <div>${id}</div>
            `;

            card.onclick = () => openVideo(id);

            card.querySelector(".delete").onclick = (e) => {
                e.stopPropagation();
                videos = videos.filter(v => v.id !== id);
                save();
                loadVideos();
            };

            card.querySelector(".fav").onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(id);
            };

            grid.appendChild(card);
        });

    } catch (err) {
        console.log(err);
        grid.innerHTML = "<p style='color:red'>Sök blockerad</p>";
    }
}

/* ================= LOAD SAVED ================= */
function loadVideos() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach((v, index) => {
        const isFav = favorites.includes(v.id);

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${isFav ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div>${v.id}</div>
        `;

        card.onclick = () => openVideo(v.id);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(index, 1);
            save();
            loadVideos();
        };

        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFavorite(v.id);
        };

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
}

/* CLOSE */
document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

/* INIT */
loadVideos();

</script>

</body>
</html>
