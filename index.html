<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Video Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

/* TOP */
.topbar {
    padding: 10px;
    background: #111;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
    font-weight: bold;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* CARD */
.card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
}

.card div {
    padding: 10px;
}

/* BUTTONS */
.delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: red;
    border: none;
    color: white;
    padding: 4px 6px;
    border-radius: 6px;
}

.fav {
    position: absolute;
    top: 6px;
    left: 6px;
    background: gold;
    border: none;
    color: black;
    padding: 4px 6px;
    border-radius: 6px;
}

/* PLAYER (TIKTOK STYLE) */
.playerView {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

iframe {
    width: 90%;
    height: 70%;
    border: none;
}

.nav {
    margin-top: 10px;
    display: flex;
    gap: 10px;
}

.nav button {
    background: #333;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
    <input id="videoId" placeholder="YouTube ID">
    <button onclick="addVideo()">Lägg till</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- PLAYER -->
<div class="playerView" id="playerView">
    <iframe id="player" allow="autoplay; fullscreen"></iframe>

    <div class="nav">
        <button onclick="prevVideo()">⬆ Föregående</button>
        <button onclick="nextVideo()">⬇ Nästa</button>
        <button onclick="closePlayer()">Stäng</button>
    </div>
</div>

<script>

/* ================= DATA ================= */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

let currentIndex = 0;

/* ================= SAVE ================= */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* ================= ADD ================= */
function addVideo() {
    const id = document.getElementById("videoId").value.trim();
    if (!id) return;

    videos.push({ id });
    save();
    load();
}

/* ================= FAVORITE ================= */
function toggleFav(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(v => v !== id);
    } else {
        favorites.push(id);
    }
    save();
    load();
}

/* ================= LOAD ================= */
function load() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach((v, i) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">${favorites.includes(v.id) ? "★" : "☆"}</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
            <div>${v.id}</div>
        `;

        card.onclick = () => openPlayer(i);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(i, 1);
            save();
            load();
        };

        card.querySelector(".fav").onclick = (e) => {
            e.stopPropagation();
            toggleFav(v.id);
        };

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openPlayer(i) {
    currentIndex = i;

    const view = document.getElementById("playerView");
    const player = document.getElementById("player");

    view.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

/* NEXT / PREV */
function nextVideo() {
    if (currentIndex < videos.length - 1) {
        openPlayer(currentIndex + 1);
    }
}

function prevVideo() {
    if (currentIndex > 0) {
        openPlayer(currentIndex - 1);
    }
}

/* CLOSE */
function closePlayer() {
    document.getElementById("playerView").style.display = "none";
    document.getElementById("player").src = "";
}

/* INIT */
load();

</script>

</body>
</html>
