<script>

/* ================= DIN KEY ================= */
const RAPIDAPI_KEY = "0f6de4aa3fmsh2fe00e58ac5fb26p13edafjsn40b3c3b4b3a3";

/* ================= DATA ================= */
let videos = JSON.parse(localStorage.getItem("videos")) || [];

function saveVideos() {
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* ================= ADD VIDEO ================= */
function addVideo(id) {
    const videoId = id || document.getElementById("videoId").value;
    if (!videoId) return;

    videos.push({
        id: videoId,
        owner: "local"
    });

    saveVideos();
    loadVideos();

    document.getElementById("videoId").value = "";
}

/* ================= SEARCH (RAPIDAPI) ================= */
async function searchVideos() {
    const query = document.getElementById("search").value;
    if (!query) return;

    try {
        const res = await fetch(`https://youtube138.p.rapidapi.com/search/?q=${encodeURIComponent(query)}`, {
            method: "GET",
            headers: {
                "X-RapidAPI-Host": "youtube138.p.rapidapi.com",
                "X-RapidAPI-Key": RAPIDAPI_KEY
            }
        });

        const data = await res.json();

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        data.contents?.forEach(item => {
            const videoId = item.video?.videoId;
            const title = item.video?.title;

            if (!videoId) return;

            const div = document.createElement("div");
            div.style.background = "#222";
            div.style.padding = "10px";
            div.style.borderRadius = "10px";
            div.style.cursor = "pointer";

            div.innerHTML = `
                <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" style="width:100%">
                <p>${title}</p>
            `;

            div.onclick = () => addVideo(videoId);

            resultsDiv.appendChild(div);
        });

    } catch (err) {
        console.error("API ERROR:", err);
        alert("Search failed. Could be blocked or invalid API key.");
    }
}

/* ================= RENDER ================= */
function loadVideos() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    videos.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";

        const thumb = `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;

        card.innerHTML = `
            <img class="thumbnail" src="${thumb}">
            <div style="padding:10px">${v.id}</div>
        `;

        card.onclick = () => openVideo(v.id);

        grid.appendChild(card);
    });
}

/* ================= PLAYER ================= */
function openVideo(id) {
    const modal = document.getElementById("modal");
    const player = document.getElementById("player");

    modal.style.display = "flex";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1&fs=1`;
}

document.getElementById("modal").onclick = () => {
    document.getElementById("modal").style.display = "none";
    document.getElementById("player").src = "";
};

/* INIT */
loadVideos();

</script>
