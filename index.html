<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Hub Pro</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
}

/* TOPBAR */
.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #111;
    padding: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #222;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: white;
}

button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: red;
    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px;
}

/* CARD */
.card {
    background: #181818;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.card img {
    width: 100%;
}

.delete, .fav {
    position: absolute;
    top: 8px;
    border: none;
    padding: 5px;
}

.delete { right: 8px; background: red; }
.fav { left: 8px; background: gold; }

/* PLAYER */
.player {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

iframe {
    width: 90%;
    height: 70%;
}

/* HELP */
.helpModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="videoInput" placeholder="YouTube länk eller ID">
    <button onclick="addVideo()">Lägg till</button>

    <input id="search" placeholder="Sök">
    <button onclick="searchLocal()">Sök</button>

    <button onclick="showHelp()">How to use</button>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
    <iframe id="frame" allow="autoplay"></iframe>

    <div style="margin-top:10px;">
        <button onclick="prev()">⬆</button>
        <button onclick="next()">⬇</button>
        <button onclick="closePlayer()">Stäng</button>
    </div>
</div>

<div class="helpModal" id="helpModal">
    <div style="background:#111;padding:20px;">
        <h2>How to use</h2>
        <p>Lägg till YouTube länk eller ID</p>
        <button onclick="closeHelp()">Stäng</button>
    </div>
</div>

<script>

/* SERVICE WORKER (PWA) */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

/* DATA */
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let currentIndex = 0;

/* SAVE */
function save() {
    localStorage.setItem("videos", JSON.stringify(videos));
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

/* VALIDATE */
function extractYouTubeID(input) {
    try {
        const idRegex = /^[a-zA-Z0-9_-]{11}$/;
        if (idRegex.test(input)) return input;

        const url = new URL(input);

        if (url.hostname.includes("youtu.be")) {
            const id = url.pathname.slice(1);
            return idRegex.test(id) ? id : null;
        }

        if (url.hostname.includes("youtube.com")) {
            const id = url.searchParams.get("v");
            return idRegex.test(id) ? id : null;
        }

        return null;
    } catch {
        return null;
    }
}

/* ADD */
function addVideo() {
    const input = document.getElementById("videoInput").value;
    const id = extractYouTubeID(input);

    if (!id) return alert("Ogiltig video");

    videos.push({ id });
    save();
    load();
}

/* LOAD */
function load(list = videos) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete">✖</button>
            <button class="fav">★</button>
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
        `;

        card.onclick = () => open(i);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            videos.splice(i, 1);
            save();
            load();
        };

        grid.appendChild(card);
    });
}

/* SEARCH */
function searchLocal() {
    const q = document.getElementById("search").value.toLowerCase();
    load(videos.filter(v => v.id.toLowerCase().includes(q)));
}

/* PLAYER */
function open(i) {
    currentIndex = i;
    document.getElementById("player").style.display = "flex";
    document.getElementById("frame").src =
        `https://www.youtube.com/embed/${videos[i].id}?autoplay=1`;
}

function closePlayer() {
    document.getElementById("player").style.display = "none";
    document.getElementById("frame").src = "";
}

function next() {
    if (currentIndex < videos.length - 1) open(currentIndex + 1);
}

function prev() {
    if (currentIndex > 0) open(currentIndex - 1);
}

/* HELP */
function showHelp() {
    document.getElementById("helpModal").style.display = "flex";
}

function closeHelp() {
    document.getElementById("helpModal").style.display = "none";
}

/* CLICK OUTSIDE */
document.getElementById("player").addEventListener("click", function(e) {
    if (e.target.id === "player") {
        closePlayer();
    }
});

/* ESC */
document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closePlayer();
    }
});

/* INIT */
load();

</script>

</body>
</html>
